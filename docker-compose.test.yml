volumes:
  postgres_data:

services:
  mlops_app:
    image: mlops_app:test
    env_file:
      - ./test/.env
    volumes:
      - ./artifacts/:/app/artifacts/:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: sh -c "uv run --group test pytest ./tests --cov=. --cov-config=./tests/.coveragerc --cov-fail-under=75"
    container_name: mlops_app_test

  migrate:
    image: mlops_app:test
    env_file:
      - ./test/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "uv run alembic upgrade head"

  postgres:
    image: postgres:17.5-alpine
    env_file:
      - ./test/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    container_name: postgres_test
